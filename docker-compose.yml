services:
  agent:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE=UserManagedIdentity
      - CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID=${UAMI_CLIENT_ID}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - agent

volumes:
  caddy_data:
